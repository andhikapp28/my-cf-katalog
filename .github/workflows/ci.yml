name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Env dummy khusus CI — BUKAN credential produksi. AUTH_SECRET dummy aman karena
# tidak pernah dipakai untuk sesi/produk sungguhan, dan ADMIN_EMAIL/ADMIN_PASSWORD
# dummy hanya dipakai untuk seed + login e2e di database Postgres service sekali pakai.
env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/dipa_katalog
  AUTH_SECRET: ci-dummy-auth-secret-not-for-production-use-only
  ADMIN_EMAIL: admin@dipakatalog.ci
  ADMIN_PASSWORD: ci-admin-password-123

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dipa_katalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run database migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
